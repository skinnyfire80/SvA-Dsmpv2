<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mi Niña 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:'Poppins',sans-serif;
    text-align:center;
}

/* GALAXIA */
#galaxy{
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center,#050510 0%,#000000 70%);
    display:none;
    overflow:hidden;
}

/* AREA CENTRAL */
#universe{
    position:absolute;
    width:80%;
    left:10%;
    height:100%;
}

/* ESTRELLAS */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:.2;}
    to{opacity:1;}
}

/* FRASES SUAVES Y LEGIBLES */
.phrase{
    position:absolute;
    color:#ff9edb;
    font-size:22px;
    font-weight:600;
    letter-spacing:.5px;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
    animation:floatElegant 6s ease forwards;
    text-shadow:0 0 10px rgba(255,158,219,.6);
}

/* NUEVA TRANSICIÓN LIMPIA */
@keyframes floatElegant{

    0%{
        opacity:0;
        transform:translate(-50%,-40%) scale(.95);
    }

    20%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }

    80%{
        opacity:1;
        transform:translate(-48%,-55%) scale(1.03);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-65%) scale(1.05);
    }
}

/* MENSAJE */
.message{
    position:relative;
    top:30%;
    transition:opacity 1s ease;
    color:white;
}

button{
    padding:14px 28px;
    font-size:18px;
    border:none;
    border-radius:25px;
    background:#ff4fa3;
    color:white;
    cursor:pointer;
    margin-top:20px;
    font-weight:600;
}
button:hover{
    background:#ff77bb;
}
</style>
</head>

<body>

<div class="message" id="message">
<h1 style="font-weight:700;">Para Ti, Mi Niña 💕</h1>
<p>Aunque la distancia nos separe, mi corazón vive contigo cada día.</p>
<p><strong>A y D</strong></p>
<button onclick="revealGalaxy()">Descubre nuestro amor en las estrellas ✨</button>
</div>

<div id="galaxy">
<div id="universe"></div>
</div>

<audio id="music" loop>
<source src="AhaTok_Angel_664c63de-7999-4b59-b96f-c50831505653.mp3" type="audio/mpeg">
</audio>

<script>
const galaxy=document.getElementById("galaxy");
const universe=document.getElementById("universe");
const message=document.getElementById("message");
const music=document.getElementById("music");

const frases=[
"Mi amor eterno 💖",
"Eres mi universo 🌌",
"Mi niña hermosa",
"Contigo todo es magia ✨",
"Siempre tú y yo",
"Mi corazón es tuyo",
"La distancia no nos vence",
"Eres mi estrella favorita ⭐",
"Te amo infinitamente",
"Mi vida eres tú",
"Mi razón de sonreír",
"Mi princesa hermosa",
"Mi alma te pertenece",
"Siempre juntos",
"Mi cielo precioso",
"Nuestro destino es uno",
"Mi universo comienza contigo",
"Te amo hasta el infinito",
"Eres mi pensamiento diario",
"Mi universo entero eres tú"
];

/* MÁS ESTRELLAS */
for(let i=0;i<800;i++){
let star=document.createElement("div");
star.className="star";
star.style.top=Math.random()*100+"%";
star.style.left=Math.random()*100+"%";
star.style.animationDuration=(Math.random()*3+1)+"s";
galaxy.appendChild(star);
}

/* DISTRIBUCIÓN EQUILIBRADA */
function posicionBalanceada(){

let col=Math.floor(Math.random()*4);
let row=Math.floor(Math.random()*6);

let ancho=100/4;
let alto=90/6;

return{
left:(col*ancho)+(ancho/2),
top:(row*alto)+(alto/2)
};
}

function revealGalaxy(){

message.style.opacity="0";

setTimeout(()=>{
message.style.display="none";
galaxy.style.display="block";
music.play();

setInterval(()=>{

for(let i=0;i<5;i++){

let pos=posicionBalanceada();

let phrase=document.createElement("div");
phrase.className="phrase";
phrase.innerText=frases[Math.floor(Math.random()*frases.length)];

phrase.style.left=pos.left+"%";
phrase.style.top=pos.top+"%";

universe.appendChild(phrase);

setTimeout(()=>{
phrase.remove();
},6000);
}

},2200);

},1000);
}
</script>

</body>
</html>
